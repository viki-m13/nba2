<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QEPE — Quantum Edge Parlay Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1>QUANTUM EDGE PARLAY ENGINE</h1>
      <p class="subtitle">Patent-Pending | 6 Proprietary Innovations | AutoResearch-Validated</p>
    </div>
    <nav>
      <button class="nav-btn active" data-view="today">Today's Picks</button>
      <button class="nav-btn" data-view="history">History</button>
      <button class="nav-btn" data-view="method">Strategy</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <div class="dashboard" id="dashboard"></div>

    <!-- Tier Cards -->
    <div class="tier-cards" id="tier-cards"></div>

    <!-- Today's Picks -->
    <div id="view-today" class="view active">
      <h2>Today's Picks</h2>
      <div id="today-status" class="status-msg">Loading...</div>
      <div id="today-picks" class="picks-grid"></div>
    </div>

    <!-- History -->
    <div id="view-history" class="view">
      <h2>Backtest History</h2>
      <div id="history-stats" class="history-stats"></div>
      <div class="history-filters" id="history-filters"></div>
      <table class="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Tier</th>
            <th>Legs</th>
            <th>Odds</th>
            <th>Result</th>
            <th>P&L</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>

    <!-- Strategy / Method -->
    <div id="view-method" class="view">
      <h2>Strategy & Innovations</h2>
      <div id="method-content" class="method-content"></div>
    </div>
  </main>

  <script src="js/qepe-engine.js"></script>
</body>
</html>
