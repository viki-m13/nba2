name: V8 CSPE Picks Generation

on:
  schedule:
    # Multiple runs per day to capture changing odds.
    # Weekdays (Mon-Fri): noon, 3 PM, 5 PM, 7 PM Eastern (+45min offset)
    # Weekends (Sat-Sun): noon only
    # -- Noon every day (EST + EDT) --
    - cron: '45 16 * * *'
    - cron: '45 17 * * *'
    # -- 3 PM weekdays (EST + EDT) --
    - cron: '45 19 * * 1-5'
    - cron: '45 20 * * 1-5'
    # -- 5 PM weekdays (EST + EDT) --
    - cron: '45 21 * * 1-5'
    - cron: '45 22 * * 1-5'
    # -- 7 PM weekdays (EST + EDT) --
    - cron: '45 23 * * 1-5'
    - cron: '45 0 * * 2-6'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: v8-cspe-picks
  cancel-in-progress: false

jobs:
  v8-cspe-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run V8 CSPE models
        run: python3 experiments/scripts/generate_v8_picks.py
        env:
          TZ: America/New_York

      - name: Commit and push V8 CSPE picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/v8-mgcc/data/nba_v8_signals.json \
                  webapp/v8-mgcc/data/nba_v8_stats.json \
                  webapp/v8-mgcc/data/nba_v8_recommendations.json \
                  webapp/v8-mgcc/data/mlb_v8_signals.json \
                  webapp/v8-mgcc/data/mlb_v8_stats.json \
                  webapp/v8-mgcc/data/mlb_v8_recommendations.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "V8 CSPE picks: $(TZ=America/New_York date '+%Y-%m-%d %I:%M %p %Z')"
          # Clean unstaged/untracked files so git pull --rebase can work
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
            git pull --rebase origin main
          done
          git push
