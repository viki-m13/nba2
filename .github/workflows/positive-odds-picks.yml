name: Positive Odds Picks Generation

on:
  schedule:
    # Run 30 minutes after the original cron to ensure fresh data is available
    # 16:30 UTC = 12:30 PM EST (Nov-Mar), 17:30 UTC = 12:30 PM EDT (Mar-Nov)
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-data-push
  cancel-in-progress: false

jobs:
  positive-odds-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if already ran today
        id: check
        run: |
          TODAY=$(TZ=America/New_York date '+%Y-%m-%d')
          # Check last 5 commits for today's positive odds run
          if git log -5 --format=%s | grep -q "Positive odds picks: $TODAY"; then
            echo "already_ran=true" >> $GITHUB_OUTPUT
          else
            echo "already_ran=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Positive Odds models
        if: steps.check.outputs.already_ran == 'false'
        run: python3 experiments/scripts/generate_picks.py
        env:
          TZ: America/New_York

      - name: Commit and push positive odds picks
        if: steps.check.outputs.already_ran == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/positive-odds/data/nba_signals.json \
                  webapp/positive-odds/data/nba_stats.json \
                  webapp/positive-odds/data/nba_recommendations.json \
                  webapp/positive-odds/data/mlb_signals.json \
                  webapp/positive-odds/data/mlb_stats.json \
                  webapp/positive-odds/data/mlb_recommendations.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Positive odds picks: $(TZ=America/New_York date '+%Y-%m-%d %I:%M %p %Z')"
          # Clean unstaged/untracked files so git pull --rebase can work
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
            git pull --rebase origin main
          done
          git push
