name: Positive Odds Picks Generation

on:
  schedule:
    # Multiple runs per day to capture changing odds.
    # Weekdays (Mon-Fri): noon, 3 PM, 5 PM, 7 PM Eastern (+30min offset)
    # Weekends (Sat-Sun): noon only
    # -- Noon every day (EST + EDT) --
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    # -- 3 PM weekdays (EST + EDT) --
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    # -- 5 PM weekdays (EST + EDT) --
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    # -- 7 PM weekdays (EST + EDT) --
    - cron: '30 23 * * 1-5'
    - cron: '30 0 * * 2-6'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: positive-odds-picks
  cancel-in-progress: false

jobs:
  positive-odds-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Positive Odds models
        run: python3 experiments/scripts/generate_picks.py
        env:
          TZ: America/New_York

      - name: Commit and push positive odds picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/positive-odds/data/nba_signals.json \
                  webapp/positive-odds/data/nba_stats.json \
                  webapp/positive-odds/data/nba_recommendations.json \
                  webapp/positive-odds/data/mlb_signals.json \
                  webapp/positive-odds/data/mlb_stats.json \
                  webapp/positive-odds/data/mlb_recommendations.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Positive odds picks: $(TZ=America/New_York date '+%Y-%m-%d %I:%M %p %Z')"
          # Clean unstaged/untracked files so git pull --rebase can work
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
            git pull --rebase origin main
          done
          git push
