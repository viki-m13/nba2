name: Daily Picks Generation

on:
  schedule:
    # Hourly from noon ET until after last tipoff (~10 PM ET).
    # Covers both EST (UTC-5, Nov-Mar) and EDT (UTC-4, Mar-Nov).
    # noon ET = 16-17 UTC, 10 PM ET = 02-03 UTC next day.
    - cron: '0 0-3,16-23 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  daily-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NBA daily picks
        run: bash scripts/daily-picks.sh
        env:
          TZ: America/New_York

      - name: Run MLB daily picks
        run: bash mlb/scripts/daily-picks-mlb.sh
        env:
          TZ: America/New_York

      - name: Commit and push updated picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/data/ultra_signals.json \
                  webapp/data/ultra_recommendations.json \
                  webapp/data/ultra_backtest_stats.json \
                  webapp/data/player_boxscores_2026.json \
                  webapp/data/historical_odds_2026.json \
                  webapp/mlb/data/mlb_ultra_signals_v3.json \
                  webapp/mlb/data/mlb_ultra_recommendations.json \
                  webapp/mlb/data/mlb_ultra_backtest_stats_v3.json \
                  mlb/webapp/data/mlb_ultra_signals_v3.json \
                  mlb/webapp/data/mlb_ultra_recommendations.json \
                  mlb/webapp/data/mlb_ultra_backtest_stats_v3.json \
                  mlb/webapp/data/mlb_player_boxscores.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily picks: $(TZ=America/New_York date '+%Y-%m-%d %I:%M %p %Z')"
          # Clean unstaged/untracked files so git pull --rebase can work
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git pull --rebase -X theirs origin main || {
            echo "Rebase conflict — accepting our generated data"
            git checkout --theirs . 2>/dev/null || true
            git add -A
            git rebase --continue --no-edit || true
          }
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
            git pull --rebase -X theirs origin main || {
              git checkout --theirs . 2>/dev/null || true
              git add -A
              git rebase --continue --no-edit || true
            }
          done
          git push
