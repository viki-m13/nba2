name: Daily Picks Generation

on:
  schedule:
    # Multiple runs per day to capture changing odds.
    # Weekdays (Mon-Fri): noon, 3 PM, 5 PM, 7 PM Eastern
    # Weekends (Sat-Sun): noon only
    # EST (Nov-Mar) offsets: noon=17, 3PM=20, 5PM=22, 7PM=00+1
    # EDT (Mar-Nov) offsets: noon=16, 3PM=19, 5PM=21, 7PM=23
    # -- Noon every day (EST + EDT) --
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    # -- 3 PM weekdays (EST + EDT) --
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # -- 5 PM weekdays (EST + EDT) --
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
    # -- 7 PM weekdays (EST + EDT) --
    - cron: '0 23 * * 1-5'
    - cron: '0 0 * * 2-6'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  daily-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NBA daily picks
        run: bash scripts/daily-picks.sh
        env:
          TZ: America/New_York

      - name: Run MLB daily picks
        run: bash mlb/scripts/daily-picks-mlb.sh
        env:
          TZ: America/New_York

      - name: Commit and push updated picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/data/ultra_signals.json \
                  webapp/data/ultra_recommendations.json \
                  webapp/data/ultra_backtest_stats.json \
                  webapp/data/player_boxscores_2026.json \
                  webapp/data/historical_odds_2026.json \
                  webapp/mlb/data/mlb_ultra_signals_v3.json \
                  webapp/mlb/data/mlb_ultra_recommendations.json \
                  webapp/mlb/data/mlb_ultra_backtest_stats_v3.json \
                  mlb/webapp/data/mlb_ultra_signals_v3.json \
                  mlb/webapp/data/mlb_ultra_recommendations.json \
                  mlb/webapp/data/mlb_ultra_backtest_stats_v3.json \
                  mlb/webapp/data/mlb_player_boxscores.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily picks: $(TZ=America/New_York date '+%Y-%m-%d %I:%M %p %Z')"
          # Clean unstaged/untracked files so git pull --rebase can work
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
            git pull --rebase origin main
          done
          git push
